<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var currentFetch = originalFetch;
          try {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function() {
                return currentFetch;
              },
              set: function(val) {
                currentFetch = val;
              }
            });
          } catch (e1) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function() {
                  return currentFetch;
                },
                set: function(val) {
                  currentFetch = val;
                }
              });
            } catch (e2) {}
          }
        } catch (e) {}
      })();
    </script>
    <title>Affliyat Hub – AI Affiliate Caption & Content Generator</title>
    <meta name="description" content="Create natural affiliate captions, titles, SEO keywords and hashtags for Instagram, Facebook and YouTube Shorts. Built for affiliate creators." />
